[project]
name = "motelandro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.134.0",
    "numpy>=2.4.2",
    "pandas>=0.3.1",
    "radon>=6.0.1",
    "rich>=14.3.3",
    "typer>=0.24.1",
    "httpx>=0.27.0",  
    "requests>=2.31.0",
    "supabase>=2.0.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.4",
    "mkdocstrings[python]>=1.0.3",
    "pytest>=9.0.2",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.radon]
cc_min = "A"
show_complexity = true
average = true