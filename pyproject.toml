[project]
name = "motelandro"
version = "0.1.0"
description = "Sistema de gestión de reservas para Motelandro"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "supabase>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "email-validator>=2.0.0",
    "streamlit>=1.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "radon>=6.0.1",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B008"] # Ignorar B008 para permitir Depends en FastAPI

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.radon]
cc_min = "A"
show_complexity = true
average = true