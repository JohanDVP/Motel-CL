name: CI Quality & Testing

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (With Cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff (Linting & Style)
        run: uv run ruff check src/

      - name: Check code complexity (Radon)
        run: uv run radon cc src -s -a -n A

      - name: Run tests (Pytest)
        env:
          # Estas variables toman los valores que configuraste en GitHub Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: uv run pytest

      # Mantuve esta sección solo si necesitas que el CI despliegue, 
      # aunque tu docs.yml ya debería hacerlo.
      - name: Deploy Documentation
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          uv run mkdocs gh-deploy --force